# Despliegue Dokploy / local: Astro estático + nginx.
# En Dokploy → Domains: Service = `landing`, Port = `4321`.
# Vars vienen del .env (Dokploy Environment; en local, copiá .env.example).

services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    image: yampi-site:latest
    ports:
      - "${HOST_PORT:-4321}:4321"
    restart: unless-stopped
