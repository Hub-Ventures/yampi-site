<!--
  Isotipo de Yampi (bocallave). Reemplaza al favicon.svg anterior, que estaba
  roto: traia el <rect> morado de fondo y un <image> SIN href, asi que los
  navegadores lo pintaban como un cuadrado morado liso sin el bocallave.

  Sigue siendo un raster embebido porque brand-assets no tiene vector real del
  isotipo (ADR-001 8.3). Cuando llegue el vector, se reemplaza este archivo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="Yampi">
  <image width="192" height="192" href="data:image/png;base64,"/>
</svg>
