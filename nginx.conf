server {
    listen 4321;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Assets hasheados de Astro: cache largo
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Redirects 301 reales (espejo de astro.config.mjs → redirects)
    # Sin esto Astro solo emite meta-refresh en HTML.
    location = /modulos/comunicaciones { return 301 /sistema-base/; }
    location = /modulos/comunicaciones/ { return 301 /sistema-base/; }
    location = /modulos/propiedades { return 301 /sistema-base/; }
    location = /modulos/propiedades/ { return 301 /sistema-base/; }
    location = /modulos/calendario { return 301 /sistema-base/; }
    location = /modulos/calendario/ { return 301 /sistema-base/; }
    location = /modulos/reportes { return 301 /sistema-base/; }
    location = /modulos/reportes/ { return 301 /sistema-base/; }

    location = /modulos/contactos { return 301 /suites/comercial/; }
    location = /modulos/contactos/ { return 301 /suites/comercial/; }
    location = /modulos/oportunidades { return 301 /suites/comercial/; }
    location = /modulos/oportunidades/ { return 301 /suites/comercial/; }
    location = /modulos/campanas { return 301 /suites/comercial/; }
    location = /modulos/campanas/ { return 301 /suites/comercial/; }
    location = /modulos/perfil-publico { return 301 /suites/comercial/; }
    location = /modulos/perfil-publico/ { return 301 /suites/comercial/; }

    location = /modulos/centro-ayuda { return 301 /suites/servicio/; }
    location = /modulos/centro-ayuda/ { return 301 /suites/servicio/; }
    location = /modulos/sla { return 301 /suites/servicio/; }
    location = /modulos/sla/ { return 301 /suites/servicio/; }

    location = /modulos/contratos { return 301 /suites/administrativa/; }
    location = /modulos/contratos/ { return 301 /suites/administrativa/; }
    location = /modulos/tesoreria { return 301 /suites/administrativa/; }
    location = /modulos/tesoreria/ { return 301 /suites/administrativa/; }

    location = /modulos/livia { return 301 /livia/; }
    location = /modulos/livia/ { return 301 /livia/; }

    location = /modulos/automatizaciones { return 301 /; }
    location = /modulos/automatizaciones/ { return 301 /; }
    location = /modulos/configuracion { return 301 /; }
    location = /modulos/configuracion/ { return 301 /; }
    location = /modulos/busqueda { return 301 /; }
    location = /modulos/busqueda/ { return 301 /; }

    # Los legales se sirven en 200 directo, sin el 301 que nginx añadiría al
    # resolver el directorio. La verificación OAuth de Google compara la URL de
    # la Cloud Console (https://yampi.ai/privacy, sin barra) con la enlazada en
    # la home: cualquier diferencia vuelve a frenar la revisión.
    location = /privacy { try_files /privacy/index.html =404; }
    location = /terms { try_files /terms/index.html =404; }

    # Legales de la landing anterior, que vivían bajo locale.
    location = /es/terms { return 301 /terms/; }
    location = /es/terms/ { return 301 /terms/; }
    location = /en/terms { return 301 /terms/; }
    location = /en/terms/ { return 301 /terms/; }
    location = /terminos { return 301 /terms/; }
    location = /terminos/ { return 301 /terms/; }

    location = /es/privacy { return 301 /privacy/; }
    location = /es/privacy/ { return 301 /privacy/; }
    location = /en/privacy { return 301 /privacy/; }
    location = /en/privacy/ { return 301 /privacy/; }
    location = /privacidad { return 301 /privacy/; }
    location = /privacidad/ { return 301 /privacy/; }

    # HTML estático de Astro (directorios con index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    # Headers básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
